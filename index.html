<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0b10">
  <title>VelixCoin — VLX Gaming Platform</title>
  <meta name="description" content="VelixCoin is a fictional VLX virtual gaming and collection platform.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230b0b10'/%3E%3Cpath d='M20 25h16l14 37 14-37h16L56 75H44z' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="splash" class="splash"><div class="brand-mark">V</div><strong>VelixCoin</strong><span>Loading workspace…</span></div>

  <div id="authView" class="auth-shell hidden">
    <div class="auth-card">
      <div class="brand-row"><div class="brand-mark">V</div><div><b>VelixCoin</b><small>Virtual gaming platform</small></div></div>
      <div id="authForms"></div>
    </div>
  </div>

  <div id="appView" class="app-shell hidden">
    <aside class="sidebar">
      <div class="brand-row sidebar-brand"><div class="brand-mark">V</div><div><b>VelixCoin</b><small>VLX Gaming</small></div></div>
      <nav id="sideNav" class="nav"></nav>
      <div class="sidebar-foot"><span>Demo economy</span><small>VLX has no real-world value.</small></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn mobile-only" data-action="menu" aria-label="Open menu">☰</button>
        <div class="top-title"><span id="pageTitle">Home</span><small>Virtual points • Entertainment only</small></div>
        <div class="top-actions">
          <button class="balance-pill" data-page="wallet"><span>VLX</span><b id="headerBalance">0</b></button>
          <button class="icon-btn" data-action="notifications" aria-label="Notifications">◌</button>
          <button class="avatar-btn" data-page="profile"><span id="headerAvatar">V</span></button>
          <button class="icon-btn" data-action="theme" aria-label="Toggle theme">◐</button>
        </div>
      </header>

      <section id="content" class="content"></section>
    </main>
  </div>

  <nav id="bottomNav" class="bottom-nav"></nav>
  <div id="toastRoot" class="toast-root"></div>
  <div id="modalRoot"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="auth.js"></script>
  <script src="games.js"></script>
  <script src="marketplace.js"></script>
  <script src="inventory.js"></script>
  <script src="trade.js"></script>
  <script src="profile.js"></script>
  <script src="app.js"></script>
</body>
</html>
